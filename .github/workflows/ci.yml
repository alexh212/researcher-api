name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      # Only the deterministic tests run here. test_planner, test_orchestrator and
      # test_evaluator call OpenAI and Tavily for real, so running the whole suite
      # on every push means paying for CI. These three need no credentials:
      # tests/conftest.py supplies dummy values at import time.
      - name: Run tests
        run: |
          pytest tests/test_cache.py tests/test_main.py tests/test_evaluator_parse.py -v
