name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      # Only the deterministic tests run here. test_planner, test_orchestrator and
      # test_evaluator call OpenAI and Tavily for real, so running the whole suite
      # on every push means paying for CI. These three open no sockets at all:
      # tests/conftest.py supplies dummy credentials at import time, and the one
      # test that reaches the streaming endpoint stubs out plan_research. Adding
      # secrets back here would not make them pass any harder — it would only put
      # live keys next to a job that has no use for them.
      - name: Run tests
        run: |
          pytest tests/test_cache.py tests/test_main.py tests/test_evaluator_parse.py -v
